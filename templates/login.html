<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; display:flex; align-items:center; justify-content:center; height:100vh; }
        .card { background: white; padding: 24px; border-radius:8px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); width:320px }
        label { display:block; margin-top:8px; font-size:14px }
        input { width:100%; padding:8px; margin-top:6px; }
        button { margin-top:12px; padding:8px 12px; width:100%; }
        .error { color: red; margin-top:8px }
    </style>
</head>
<body>
    <div class="card">
        <h3>Control Panel Login</h3>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <label for="username">Username</label>
            <input id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
